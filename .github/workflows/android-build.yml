name: Build JALVI AI 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Gradle scaffold and preserve app files
        shell: bash
        run: |
          mkdir -p /tmp/jalvi-custom
          cp android/app/src/main/AndroidManifest.xml /tmp/jalvi-custom/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/jalvi/ai/jalvi_ai/MainActivity.kt /tmp/jalvi-custom/MainActivity.kt
          flutter create --platforms=android --org com.jalvi.ai --project-name jalvi_ai --overwrite /tmp/jalvi_scaffold
          mkdir -p android
          cp -a /tmp/jalvi_scaffold/android/. android/
          mkdir -p android/app/src/main/kotlin/com/jalvi/ai/jalvi_ai
          cp /tmp/jalvi-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/jalvi-custom/MainActivity.kt android/app/src/main/kotlin/com/jalvi/ai/jalvi_ai/MainActivity.kt

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jalvi-ai-2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
